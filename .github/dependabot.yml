version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # JerryProxy supports CPython 3.7, so an upgrade whose own requires_python
    # excludes 3.7 cannot be accepted: every 3.7 matrix cell fails at install
    # time. The pins in requirements*.txt already express those ceilings; these
    # entries stop the same rejected upgrade being reproposed every month.
    #
    # Remove an entry only together with the ceiling it mirrors, and remove the
    # whole block when Python 3.7 support is dropped.
    ignore:
      # click 8.2 requires >= 3.10.  One click version across the matrix also
      # keeps rendered --help output comparable between cells.
      - dependency-name: click
        versions: [">=8.2"]
      # pytest-cov 5 requires >= 3.8.
      - dependency-name: pytest-cov
        versions: [">=5"]
      # twine 6 requires >= 3.8.
      - dependency-name: twine
        versions: [">=6"]
      # PyInstaller 6 requires >= 3.8, and the standalone lane builds on 3.7.
      - dependency-name: pyinstaller
        versions: [">=6"]
      # rich 13.9 requires >= 3.8. One rich version across the matrix also keeps
      # the styled startup guide byte-identical between cells, which the human
      # output tests compare directly.
      - dependency-name: rich
        versions: [">=13.9"]
      # setuptools 68.1 requires >= 3.8, and the standalone lane builds on 3.7.
      - dependency-name: setuptools
        versions: [">=68.1"]
      # build 1.2 requires >= 3.8, and the standalone lane builds on 3.7.
      - dependency-name: build
        versions: [">=1.2"]
      # coverage 7.3 requires >= 3.8; 7.2.7 is the newest line declaring 3.7.
      - dependency-name: coverage
        versions: [">=7.3"]
      # tqdm 4.68.3 requires >= 3.8; 4.68.2 is the newest release declaring
      # 3.7. An earlier revision of this entry said 4.69 and was wrong, which
      # let 4.68.4 through -- take the boundary from the release that actually
      # changed requires_python, not from the next minor.
      - dependency-name: tqdm
        versions: [">=4.68.3"]
      # pytest 8 requires >= 3.8; the 7.4 line is the newest declaring 3.7.
      - dependency-name: pytest
        versions: [">=8"]
      # tabulate 0.10 requires >= 3.10; 0.9.0 is the newest declaring 3.7.
      - dependency-name: tabulate
        versions: [">=0.10"]
      # urllib3 2 requires >= 3.10, and the standalone build additionally
      # targets OpenSSL 1.1.0, which urllib3 2 dropped. This ignore outlives
      # the 3.7 block: remove it only when both constraints are retired.
      - dependency-name: urllib3
        versions: [">=2"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
