name: Backend Integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Reproduce with original exception causes
        run: |
          python -u - <<'PYTHON'
          import os
          import platform
          from pathlib import Path
          from jerryproxy.backend.manager import BackendManager
          from jerryproxy.backend.anchored import AnchoredDirectory
          from jerryproxy.home import JerryProxyPaths

          print(platform.platform())
          original = AnchoredDirectory.open_existing_file
          def observed(self, parts, writable=False, expected_identity=None):
              print("OPEN", str(self.root), parts, "writable=", writable, flush=True)
              return original(self, parts, writable=writable, expected_identity=expected_identity)
          AnchoredDirectory.open_existing_file = observed
          manager = BackendManager(JerryProxyPaths(Path("backend-home")))
          manager.install("v2ray", "5.53.0")
          print("INSTALLED 5.53.0", flush=True)
          manager.install("v2ray", "5.52.0", activate=False)
          print("INSTALLED 5.52.0", flush=True)
          PYTHON
