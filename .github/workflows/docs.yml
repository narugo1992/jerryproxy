name: Docs Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sphinx:
    name: Sphinx strict docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e . -r requirements-doc.txt
      - name: Build Sphinx documentation with warnings as errors
        run: make pdocs
      - uses: actions/upload-artifact@v7
        with:
          name: jerryproxy-sphinx-html
          if-no-files-found: error
          path: docs/build/html
