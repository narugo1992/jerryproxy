name: Docs Check

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "jerryproxy/**"
      - "requirements-doc.txt"
      - "Makefile"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "jerryproxy/**"
      - "requirements-doc.txt"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e . -r requirements-doc.txt
      - run: make pdocs
      - uses: actions/upload-artifact@v4
        with:
          name: jerryproxy-docs
          path: docs/build/html
