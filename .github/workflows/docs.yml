name: Docs Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sphinx:
    name: Sphinx strict docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e . -r requirements-doc.txt
      - name: Verify generated API documentation is current
        shell: bash
        run: |
          make -B rst_auto
          git diff --exit-code -- docs/source/api_doc.rst docs/source/api_doc
          test -z "$(git status --porcelain --untracked-files=all -- docs/source/api_doc.rst docs/source/api_doc)"
      - name: Build Sphinx documentation with warnings as errors
        run: make pdocs
      - uses: actions/upload-artifact@v7
        with:
          name: jerryproxy-sphinx-html
          if-no-files-found: error
          path: docs/build/html
