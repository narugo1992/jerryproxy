name: Backend Catalog Update

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: backend-catalog-update
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  pending:
    name: Reuse an open catalog review
    runs-on: ubuntu-22.04
    outputs:
      number: ${{ steps.find.outputs.number }}
    steps:
      # One pending review blocks new refresh branches. Recognize legacy bot
      # reviews too; the newest one contains the accumulated catalog updates.
      - name: Find an open catalog pull request
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          number="$(gh pr list --state open --base main --limit 1000 \
            --json number,title,body,headRefName,author | jq -r '
            [.[] | select(
              (.title == "chore(catalog): refresh backend release catalogs" and
               (.body | contains("<!-- jerryproxy:backend-catalog-refresh -->"))) or
              (.title == "chore: refresh backend catalogs" and
               (.headRefName | startswith("automation/backend-catalog-")) and
               .author.login == "app/github-actions")
            )] | sort_by(.number) | last | .number // empty')"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Remind the existing review
        if: steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/catalog-comment.md" <<EOF
          Scheduled catalog maintenance found this review still open. No new branch or pull request was created, and this branch was not updated. After this review is merged or closed, the next scheduled or manual run will refresh catalogs from main.

          Maintenance run: $RUN_URL
          EOF
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/catalog-comment.md"
  update:
    needs: pending
    if: needs.pending.outputs.number == ''
    name: Refresh stable backend catalogs
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install maintenance and validation dependencies
        run: >-
          python -m pip install -e .
          -r requirements-test.txt
          -r requirements-dev.txt
          -r requirements-doc.txt
          -r requirements-build.txt
      - name: Refresh four stable-release catalogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make catalog_update
      - name: Detect catalog changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- jerryproxy/data/*.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify maintenance scope
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^jerryproxy/data/(mihomo|sing-box|v2ray|xray)\.json$' || true)"
          test -z "$unexpected"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -ge 1
      - name: Validate exact generated tree
        if: steps.changes.outputs.changed == 'true'
        run: make check
      - name: Verify frozen CLI contains the catalogs
        if: steps.changes.outputs.changed == 'true'
        run: |
          make build
          ./dist/jerryproxy backend list known
          ./dist/jerryproxy backend list known mihomo --limit 2
          version="$(./dist/jerryproxy backend list known mihomo --limit 1 --json | python -c 'import json,sys; print(json.load(sys.stdin)[0]["version"])')"
          ./dist/jerryproxy backend list known mihomo "$version"
          ./dist/jerryproxy --home build/catalog-self-check self-check
      - name: Publish catalog refresh branch
        id: publish
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          branch="automation/backend-catalog-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jerryproxy/data/mihomo.json
          git add jerryproxy/data/sing-box.json
          git add jerryproxy/data/v2ray.json
          git add jerryproxy/data/xray.json
          git commit -m "chore: refresh backend catalogs"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open maintainer-review pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/catalog-pr.md" <<'EOF'
          <!-- jerryproxy:backend-catalog-refresh -->

          Automated stable-release catalog refresh. Merge only after the dispatched validation workflows pass and a narugo1992 maintainer reviews the upstream changes.
          EOF
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(catalog): refresh backend release catalogs" \
            --body-file "$RUNNER_TEMP/catalog-pr.md"
      - name: Dispatch branch validation
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        shell: bash
        run: |
          gh workflow run test.yml --ref "$BRANCH"
          gh workflow run docs.yml --ref "$BRANCH"
          gh workflow run package.yml --ref "$BRANCH"
          gh workflow run standalone.yml --ref "$BRANCH"
          gh workflow run backend-integration.yml --ref "$BRANCH"
