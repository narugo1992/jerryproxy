name: Code Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce repository identity boundary
        shell: bash
        run: |
          blocked_identity='han''sbug'
          blocked_reference='pyfc''stm'
          if git grep -n -i -E "${blocked_identity}|${blocked_reference}" \
            -- . ':(exclude)CONTRIBUTORS.md'; then
            echo "Repository identity boundary violation." >&2
            exit 1
          fi

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "pip<24.1"
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: make lint

  unit:
    name: Unit (${{ matrix.platform }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            python: "3.7.17"
          - platform: Linux
            os: ubuntu-22.04
            python: "3.8"
          - platform: Linux
            os: ubuntu-22.04
            python: "3.9"
          - platform: Linux
            os: ubuntu-22.04
            python: "3.10"
          - platform: Linux
            os: ubuntu-latest
            python: "3.11"
          - platform: Linux
            os: ubuntu-latest
            python: "3.12"
          - platform: Linux
            os: ubuntu-latest
            python: "3.13"
          - platform: Linux
            os: ubuntu-latest
            python: "3.14"
          - platform: Windows
            os: windows-2022
            python: "3.7.9"
          - platform: Windows
            os: windows-2022
            python: "3.8"
          - platform: Windows
            os: windows-2022
            python: "3.9"
          - platform: Windows
            os: windows-2022
            python: "3.10"
          - platform: Windows
            os: windows-2022
            python: "3.11"
          - platform: Windows
            os: windows-2022
            python: "3.12"
          - platform: Windows
            os: windows-2022
            python: "3.13"
          - platform: Windows
            os: windows-2022
            python: "3.14"
          - platform: macOS
            os: macos-15-intel
            python: "3.7.17"
          - platform: macOS
            os: macos-15-intel
            python: "3.8"
          - platform: macOS
            os: macos-15-intel
            python: "3.9"
          - platform: macOS
            os: macos-15-intel
            python: "3.10"
          - platform: macOS
            os: macos-15-intel
            python: "3.11"
          - platform: macOS
            os: macos-15-intel
            python: "3.12"
          - platform: macOS
            os: macos-15-intel
            python: "3.13"
          - platform: macOS
            os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Pin pip for Python 3.7
        if: startsWith(matrix.python, '3.7')
        run: python -m pip install "pip<24.1"
      - name: Upgrade pip on maintained Python
        if: ${{ !startsWith(matrix.python, '3.7') }}
        run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements-test.txt
      - name: Run unit tests
        run: >-
          python -m pytest test -sv -m "unittest and not windows_native"
          --junitxml=junit.xml -o junit_family=legacy
          --cov=jerryproxy --cov-report=term-missing --cov-report=xml
          --cov-fail-under=97
      - name: Upload unit coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          flags: python
          name: unit-${{ matrix.platform }}-py${{ matrix.python }}
          fail_ci_if_error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-${{ matrix.platform }}-py${{ matrix.python }}
          if-no-files-found: error
          path: |
            junit.xml
            coverage.xml

  windows-hardening:
    name: Windows native hardening
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements-test.txt
      - name: Run native Windows hardening tests
        run: >-
          python -m pytest test -sv -m windows_native
          --junitxml=windows-hardening-junit.xml -o junit_family=legacy
          --cov=jerryproxy --cov-report=term-missing --cov-report=xml
      - name: Upload native Windows coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          flags: python
          name: windows-hardening-py3.11
          fail_ci_if_error: true
      - name: Upload native Windows test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-hardening-junit
          if-no-files-found: error
          path: |
            windows-hardening-junit.xml
            coverage.xml

  gate:
    name: Code test gate
    if: always()
    needs: [repository-policy, lint, unit, windows-hardening]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          POLICY_RESULT: ${{ needs.repository-policy.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          WINDOWS_HARDENING_RESULT: ${{ needs.windows-hardening.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$LINT_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$WINDOWS_HARDENING_RESULT" = success
