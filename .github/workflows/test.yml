name: Code Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce repository identity boundary
        shell: bash
        run: |
          blocked_identity='han''sbug'
          blocked_reference='pyfc''stm'
          if git grep -n -i -E "${blocked_identity}|${blocked_reference}" \
            -- . ':(exclude)CONTRIBUTORS.md'; then
            echo "Repository identity boundary violation." >&2
            exit 1
          fi

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "pip<24.1"
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: make lint
      - name: Validate the data-plane fixture invariants
        # These guards are the only thing keeping the sentinel unreachable and
        # the fixture credentials redactable. Defining them without running
        # them leaves the design unenforced.
        run: make e2e_check
      - name: Validate pinned archive corpus measurements
        run: make archive_corpus_check
      - name: Check the licence record of everything distributed
        # A dependency added without a licence review reaches users inside the
        # wheel and embedded in the standalone executables. `make check` covers
        # this too, but only the weekly catalog workflow runs that target, so
        # the gate has to be invoked here to reach a pull request at all.
        run: make license_check

  unit:
    name: Unit (${{ matrix.platform }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            python: "3.7.17"
          - platform: Linux
            os: ubuntu-22.04
            python: "3.8"
          - platform: Linux
            os: ubuntu-22.04
            python: "3.9"
          - platform: Linux
            os: ubuntu-22.04
            python: "3.10"
          - platform: Linux
            os: ubuntu-latest
            python: "3.11"
          - platform: Linux
            os: ubuntu-latest
            python: "3.12"
          - platform: Linux
            os: ubuntu-latest
            python: "3.13"
          - platform: Linux
            os: ubuntu-latest
            python: "3.14"
          - platform: Windows
            os: windows-2022
            python: "3.7.9"
          - platform: Windows
            os: windows-2022
            python: "3.8"
          - platform: Windows
            os: windows-2022
            python: "3.9"
          - platform: Windows
            os: windows-2022
            python: "3.10"
          - platform: Windows
            os: windows-2022
            python: "3.11"
          - platform: Windows
            os: windows-2022
            python: "3.12"
          - platform: Windows
            os: windows-2022
            python: "3.13"
          - platform: Windows
            os: windows-2022
            python: "3.14"
          - platform: macOS
            os: macos-15-intel
            python: "3.7.17"
          - platform: macOS
            os: macos-15-intel
            python: "3.8"
          - platform: macOS
            os: macos-15-intel
            python: "3.9"
          - platform: macOS
            os: macos-15-intel
            python: "3.10"
          - platform: macOS
            os: macos-15-intel
            python: "3.11"
          - platform: macOS
            os: macos-15-intel
            python: "3.12"
          - platform: macOS
            os: macos-15-intel
            python: "3.13"
          - platform: macOS
            os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    # macOS unit runs were measured across twelve branches at 524s-921s
    # against a 900s limit, so which branch timed out was luck rather than
    # a property of its change. Sized for headroom over the slowest run
    # observed, not trimmed to it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Pin pip for Python 3.7
        if: startsWith(matrix.python, '3.7')
        run: python -m pip install "pip<24.1"
      - name: Upgrade pip on maintained Python
        if: ${{ !startsWith(matrix.python, '3.7') }}
        run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements-test.txt
      - name: Run unit tests
        run: >-
          python -m pytest test -sv -m "unittest and not windows_native"
          --junitxml=junit.xml -o junit_family=legacy
          --cov=jerryproxy --cov-report=term-missing --cov-report=xml
      - name: Upload unit coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          flags: python
          name: unit-${{ matrix.platform }}-py${{ matrix.python }}
          fail_ci_if_error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-${{ matrix.platform }}-py${{ matrix.python }}
          if-no-files-found: error
          path: |
            junit.xml
            coverage.xml

  provision:
    name: Data-plane credentials
    # Service containers read their configuration from `env` at creation time,
    # before any step can run, so the per-run credentials have to come from an
    # upstream job's outputs. They are one-run fixture values with no meaning
    # outside this workflow run.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      marker: ${{ steps.generate.outputs.marker }}
      ss_password: ${{ steps.generate.outputs.ss_password }}
      vmess_id: ${{ steps.generate.outputs.vmess_id }}
      vless_id: ${{ steps.generate.outputs.vless_id }}
      reality_private_key: ${{ steps.generate.outputs.reality_private_key }}
      reality_public_key: ${{ steps.generate.outputs.reality_public_key }}
      short_id: ${{ steps.generate.outputs.short_id }}
      trojan_password: ${{ steps.generate.outputs.trojan_password }}
      hysteria2_password: ${{ steps.generate.outputs.hysteria2_password }}
      tuic_uuid: ${{ steps.generate.outputs.tuic_uuid }}
      tuic_password: ${{ steps.generate.outputs.tuic_password }}
      anytls_password: ${{ steps.generate.outputs.anytls_password }}
      tls_certificate: ${{ steps.generate.outputs.tls_certificate }}
      tls_key: ${{ steps.generate.outputs.tls_key }}
      tls_server_name: ${{ steps.generate.outputs.tls_server_name }}
      subscription_body: ${{ steps.generate.outputs.subscription_body }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch the pinned proxy release for key generation
        run: |
          set -euo pipefail
          python -m pip install -q -e .
          url=$(python tools/e2e/pinned.py --field url)
          sha=$(python tools/e2e/pinned.py --field sha256)
          curl -fsSL -o /tmp/xray.zip "$url"
          echo "$sha  /tmp/xray.zip" | sha256sum -c -
          unzip -j -o /tmp/xray.zip xray -d /tmp
          chmod 0755 /tmp/xray
      - name: Generate one run's credentials
        id: generate
        run: python tools/e2e/provision.py --xray /tmp/xray --output "$GITHUB_OUTPUT"

  e2e-images:
    name: Fixture images
    # Service containers exist before any step, so the images must already be
    # in a registry. Building them here would be too late.
    #
    # A fork's token is read-only by design, so it cannot publish. The data
    # plane is skipped there rather than failing the fork's CI, which the
    # `data-plane-gate` job at the end of this file accepts only for a fork.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    uses: ./.github/workflows/e2e-images.yml
    permissions:
      contents: read
      packages: write

  unit-data-plane:
    name: Unit (Linux, data plane)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    # The same unit suite, run with the environment its data-plane cases need.
    # Everywhere else those cases skip; here they exercise the real protocols.
    needs: [provision, e2e-images]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    # Above the sum of the suite's declared per-test budgets, so the worst case
    # is a named test failure rather than an unattributed job kill — a killed
    # job is not guaranteed to run the log capture below.
    timeout-minutes: 45
    services:
      # No `ports`: a runner-hosted job cannot reach a service that publishes
      # none, while the proxy services share the job network and can. That is
      # what makes reaching the sentinel proof the traffic went through a proxy.
      sentinel:
        image: ${{ needs.e2e-images.outputs.sentinel }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          JERRYPROXY_E2E_MARKER: ${{ needs.provision.outputs.marker }}
          JERRYPROXY_E2E_SENTINEL_PORT: "8080"
        # Readiness matters even without a published port: the proxies reach
        # these two, and the Reality handshake needs camouflage's certificate,
        # which is generated at start.
        options: >-
          --health-cmd "wget -q -O- http://127.0.0.1:8080/jerryproxy-e2e-marker || exit 1"
          --health-interval 3s --health-retries 20 --health-start-period 3s
      camouflage:
        image: ${{ needs.e2e-images.outputs.camouflage }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          E2E_REALITY_SNI: www.example.test
          E2E_PORT: "8443"
        options: >-
          --health-cmd "wget -q --no-check-certificate -O- https://127.0.0.1:8443/ || exit 1"
          --health-interval 3s --health-retries 20 --health-start-period 5s
      subscription:
        image: ${{ needs.e2e-images.outputs.subscription }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 18081:8081
        env:
          E2E_PORT: "8081"
          E2E_SUBSCRIPTION_BODY: ${{ needs.provision.outputs.subscription_body }}
        options: >-
          --health-cmd "wget -q -O- http://127.0.0.1:8081/subscription || exit 1"
          --health-interval 3s --health-retries 20 --health-start-period 3s
      ss-server:
        image: ${{ needs.e2e-images.outputs.xray }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 10001:10001
        env:
          E2E_PROTOCOL: ss
          E2E_PORT: "10001"
          E2E_SS_PASSWORD: ${{ needs.provision.outputs.ss_password }}
        options: >-
          --health-cmd "wget -q -T2 -O- http://127.0.0.1:10001/ 2>&1 | grep -q . || nc -z 127.0.0.1 10001"
          --health-interval 3s --health-retries 20 --health-start-period 3s
      vmess-server:
        image: ${{ needs.e2e-images.outputs.xray }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 10002:10002
        env:
          E2E_PROTOCOL: vmess
          E2E_PORT: "10002"
          E2E_VMESS_ID: ${{ needs.provision.outputs.vmess_id }}
        options: >-
          --health-cmd "nc -z 127.0.0.1 10002"
          --health-interval 3s --health-retries 20 --health-start-period 3s
      vless-server:
        image: ${{ needs.e2e-images.outputs.xray }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 10003:10003
        env:
          E2E_PROTOCOL: vless
          E2E_PORT: "10003"
          E2E_VLESS_ID: ${{ needs.provision.outputs.vless_id }}
          E2E_REALITY_PRIVATE_KEY: ${{ needs.provision.outputs.reality_private_key }}
          E2E_REALITY_SHORT_ID: ${{ needs.provision.outputs.short_id }}
          E2E_REALITY_DEST: camouflage:8443
          E2E_REALITY_SNI: www.example.test
        options: >-
          --health-cmd "nc -z 127.0.0.1 10003"
          --health-interval 3s --health-retries 20 --health-start-period 3s
      trojan-server:
        image: ${{ needs.e2e-images.outputs.xray }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 10004:10004
        env:
          E2E_PROTOCOL: trojan
          E2E_PORT: "10004"
          E2E_TROJAN_PASSWORD: ${{ needs.provision.outputs.trojan_password }}
          E2E_TLS_SERVER_NAME: ${{ needs.provision.outputs.tls_server_name }}
          E2E_TLS_CERTIFICATE: ${{ needs.provision.outputs.tls_certificate }}
          E2E_TLS_KEY: ${{ needs.provision.outputs.tls_key }}
        options: >-
          --health-cmd "nc -z 127.0.0.1 10004"
          --health-interval 3s --health-retries 20 --health-start-period 3s
      # Hysteria2, TUIC, and AnyTLS run on sing-box: Xray's exact validator
      # rejects all three outright, so the Xray fixture cannot serve them.
      # All three are QUIC-based, so their ports must be published for UDP.
      hysteria2-server:
        image: ${{ needs.e2e-images.outputs.singbox }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 10005:10005/udp
        env:
          E2E_PROTOCOL: hysteria2
          E2E_PORT: "10005"
          E2E_HYSTERIA2_PASSWORD: ${{ needs.provision.outputs.hysteria2_password }}
          E2E_TLS_SERVER_NAME: ${{ needs.provision.outputs.tls_server_name }}
          E2E_TLS_CERTIFICATE: ${{ needs.provision.outputs.tls_certificate }}
          E2E_TLS_KEY: ${{ needs.provision.outputs.tls_key }}
        options: >-
          --health-cmd "netstat -lun | grep -q ':10005 '"
          --health-interval 3s --health-retries 20 --health-start-period 3s
      tuic-server:
        image: ${{ needs.e2e-images.outputs.singbox }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 10006:10006/udp
        env:
          E2E_PROTOCOL: tuic
          E2E_PORT: "10006"
          E2E_TUIC_UUID: ${{ needs.provision.outputs.tuic_uuid }}
          E2E_TUIC_PASSWORD: ${{ needs.provision.outputs.tuic_password }}
          E2E_TLS_SERVER_NAME: ${{ needs.provision.outputs.tls_server_name }}
          E2E_TLS_CERTIFICATE: ${{ needs.provision.outputs.tls_certificate }}
          E2E_TLS_KEY: ${{ needs.provision.outputs.tls_key }}
        options: >-
          --health-cmd "netstat -lun | grep -q ':10006 '"
          --health-interval 3s --health-retries 20 --health-start-period 3s
      anytls-server:
        image: ${{ needs.e2e-images.outputs.singbox }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 10007:10007
        env:
          E2E_PROTOCOL: anytls
          E2E_PORT: "10007"
          E2E_ANYTLS_PASSWORD: ${{ needs.provision.outputs.anytls_password }}
          E2E_TLS_SERVER_NAME: ${{ needs.provision.outputs.tls_server_name }}
          E2E_TLS_CERTIFICATE: ${{ needs.provision.outputs.tls_certificate }}
          E2E_TLS_KEY: ${{ needs.provision.outputs.tls_key }}
        options: >-
          --health-cmd "nc -z 127.0.0.1 10007"
          --health-interval 3s --health-retries 20 --health-start-period 3s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . -r requirements-test.txt
      - name: Confirm the sentinel is unreachable from the runner
        run: |
          set -uo pipefail
          # If the runner could reach it, every data-plane assertion below would
          # pass without proving traffic went through a proxy. Fail the setup
          # rather than let the suite report a meaningless success.
          if getent hosts sentinel >/dev/null 2>&1; then
            echo "::error::the runner resolves the sentinel; the isolation is broken"
            exit 1
          fi
          echo "sentinel is not resolvable from the runner, as required"
      - name: Compose the node URIs from the provisioned parts
        # Not job outputs: the runner scans outputs with a credential heuristic
        # and silently drops one it dislikes, which failed this lane on an empty
        # variable rather than on anything real. The URIs are derived, so they
        # are rebuilt here from the parts instead.
        env:
          SS_PASSWORD: ${{ needs.provision.outputs.ss_password }}
          VMESS_ID: ${{ needs.provision.outputs.vmess_id }}
          VLESS_ID: ${{ needs.provision.outputs.vless_id }}
          REALITY_PUBLIC_KEY: ${{ needs.provision.outputs.reality_public_key }}
          SHORT_ID: ${{ needs.provision.outputs.short_id }}
          TROJAN_PASSWORD: ${{ needs.provision.outputs.trojan_password }}
          HYSTERIA2_PASSWORD: ${{ needs.provision.outputs.hysteria2_password }}
          TUIC_UUID: ${{ needs.provision.outputs.tuic_uuid }}
          TUIC_PASSWORD: ${{ needs.provision.outputs.tuic_password }}
          ANYTLS_PASSWORD: ${{ needs.provision.outputs.anytls_password }}
          TLS_SERVER_NAME: ${{ needs.provision.outputs.tls_server_name }}
        run: python tools/e2e/provision.py --emit-nodes --output "$GITHUB_ENV"

      - name: Run unit tests with the data plane present
        env:
          V2RAY_SUBSCRIPTION: http://127.0.0.1:18081/subscription
          JERRYPROXY_E2E_SENTINEL_HOST: sentinel
          JERRYPROXY_E2E_SENTINEL_PORT: "8080"
          JERRYPROXY_E2E_MARKER: ${{ needs.provision.outputs.marker }}
          JERRYPROXY_E2E_BACKEND: mihomo
          JERRYPROXY_E2E_BACKEND_VERSION: 1.19.29
          JERRYPROXY_E2E_PUBLIC_PROBES: https://www.gstatic.com/generate_204,https://cloudflare.com/cdn-cgi/trace
          JERRYPROXY_E2E_ENFORCE: "1"
        run: >-
          python -m pytest test -sv -m "unittest and not windows_native"
          --junitxml=junit.xml -o junit_family=legacy
          --cov=jerryproxy --cov-report=term-missing --cov-report=xml
      - name: Upload data-plane coverage to Codecov
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          flags: python
          name: unit-linux-data-plane
          fail_ci_if_error: true
      - name: Capture fixture logs on failure
        if: failure()
        # Every secret-bearing provisioned value goes into the redaction script,
        # and the logs are actually piped through it. `make e2e_check` enforces
        # that in both directions; the non-secret values it exempts are named
        # there rather than left to inference. A fixture that rejects its
        # configuration can echo a credential, and the Reality private key
        # reaches no other variable in this job.
        env:
          R_marker: ${{ needs.provision.outputs.marker }}
          R_ss_password: ${{ needs.provision.outputs.ss_password }}
          R_vmess_id: ${{ needs.provision.outputs.vmess_id }}
          R_vless_id: ${{ needs.provision.outputs.vless_id }}
          R_reality_private_key: ${{ needs.provision.outputs.reality_private_key }}
          R_reality_public_key: ${{ needs.provision.outputs.reality_public_key }}
          R_short_id: ${{ needs.provision.outputs.short_id }}
          R_trojan_password: ${{ needs.provision.outputs.trojan_password }}
          R_hysteria2_password: ${{ needs.provision.outputs.hysteria2_password }}
          R_tuic_uuid: ${{ needs.provision.outputs.tuic_uuid }}
          R_tuic_password: ${{ needs.provision.outputs.tuic_password }}
          R_anytls_password: ${{ needs.provision.outputs.anytls_password }}
          R_tls_key: ${{ needs.provision.outputs.tls_key }}
          R_subscription_body: ${{ needs.provision.outputs.subscription_body }}
        run: |
          set -uo pipefail
          umask 077
          : > /tmp/e2e-secrets
          env | sed -n 's/^R_//p' >> /tmp/e2e-secrets
          python tools/e2e/redact.py --env-file /tmp/e2e-secrets --output /tmp/redact.sed
          for name in sentinel camouflage subscription ss-server vmess-server \
                      vless-server trojan-server hysteria2-server tuic-server anytls-server; do
            id=$(docker ps -a --filter "name=$name" --format '{{.ID}}' | head -1)
            [ -n "$id" ] || continue
            echo "===== $name ====="
            docker logs --tail 120 "$id" 2>&1 | sed -f /tmp/redact.sed | head -c 20000
          done
          rm -f /tmp/e2e-secrets /tmp/redact.sed

  data-plane-gate:
    name: Data plane ran
    needs: [unit-data-plane]
    # Must observe a skipped or failed upstream, so it cannot itself be skipped.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require that the data-plane lane actually ran
        env:
          RESULT: ${{ needs.unit-data-plane.result }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          # A skipped lane and a lane with nothing to report look identical in
          # the run summary, and that is how a housekeeping failure in the image
          # workflow silently disabled every data-plane assertion on main. This
          # job exists so that silence fails instead.
          if [ "$RESULT" = "success" ]; then
            echo "data-plane lane ran and passed"
            exit 0
          fi
          if [ "$IS_FORK" = "true" ] && [ "$RESULT" = "skipped" ]; then
            # A fork's token cannot publish fixture images, so the lane has no
            # images to consume. This is the only accepted reason to skip.
            echo "::notice::data-plane lane skipped for a fork pull request"
            exit 0
          fi
          echo "::error::data-plane lane result was '$RESULT'; it must run and pass outside fork pull requests" >&2
          exit 1
