name: Standalone CLI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: dist/jerryproxy
            archive: dist/jerryproxy-linux-amd64.tar.gz
            name: jerryproxy-linux-amd64
          - os: windows-2022
            binary: dist/jerryproxy.exe
            archive: dist/jerryproxy-windows-amd64.zip
            name: jerryproxy-windows-amd64
          - os: macos-15-intel
            binary: dist/jerryproxy
            archive: dist/jerryproxy-macos-amd64.tar.gz
            name: jerryproxy-macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e . -r requirements-build.txt
      - run: python -m PyInstaller --clean --onefile --console --name jerryproxy jerryproxy_cli.py
      - name: Smoke-test standalone CLI
        run: ${{ matrix.binary }} --version
      - name: Archive Unix standalone CLI
        if: runner.os != 'Windows'
        run: tar -C dist -czf ${{ matrix.archive }} jerryproxy
      - name: Archive Windows standalone CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.binary }} -DestinationPath ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}
