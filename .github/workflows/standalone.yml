name: Standalone CLI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: standalone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build with Python 3.7 (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            binary: dist/jerryproxy
            staged_binary: jerryproxy
            archive: jerryproxy-linux-amd64.tar.gz
            artifact: jerryproxy-linux-amd64
          - platform: Windows
            os: windows-2022
            python: "3.7.9"
            binary: dist/jerryproxy.exe
            staged_binary: jerryproxy.exe
            archive: jerryproxy-windows-amd64.zip
            artifact: jerryproxy-windows-amd64
          - platform: macOS
            os: macos-15-intel
            python: "3.7.17"
            binary: dist/jerryproxy
            staged_binary: jerryproxy
            archive: jerryproxy-macos-amd64.tar.gz
            artifact: jerryproxy-macos-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Python 3.7 build dependencies
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pip install "pip<24.1"
          python -m pip install -e . -r requirements-build.txt
          python --version
      - name: Build one-file CLI with PyInstaller
        if: runner.os != 'Linux'
        run: >-
          python -m PyInstaller --clean --onefile --console
          --name jerryproxy jerryproxy_cli.py
      - name: Build Linux CLI in pinned Python 3.7 Docker image
        if: runner.os == 'Linux'
        run: make build_linux
      - name: Verify Linux ELF loader baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file "${{ matrix.binary }}"
          readelf --version-info "${{ matrix.binary }}"
          required_glibc="$({
            readelf --version-info "${{ matrix.binary }}" |
              sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p'
          } | sort -Vu | tail -n 1)"
          test -n "$required_glibc"
          oldest="$(printf '%s\n' "$required_glibc" 2.17 | sort -Vu | head -n 1)"
          test "$oldest" = "$required_glibc"
          echo "Highest external GLIBC symbol requirement: $required_glibc"
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.binary }}" "out/${{ matrix.staged_binary }}"
      - name: Archive Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          tar -czf "out/${{ matrix.archive }}"
          -C out "${{ matrix.staged_binary }}"
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path "out/${{ matrix.staged_binary }}"
          -DestinationPath "out/${{ matrix.archive }}"
      - name: Record binary and archive digests
        shell: bash
        run: |
          python - "out/${{ matrix.staged_binary }}" "out/${{ matrix.archive }}" <<'PY'
          import hashlib
          import os
          import sys

          with open("out/artifact-sha256.txt", "w", encoding="ascii", newline="\n") as manifest:
              for path in sys.argv[1:]:
                  digest = hashlib.sha256()
                  with open(path, "rb") as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(chunk)
                  manifest.write("{}  {}\n".format(digest.hexdigest(), os.path.basename(path)))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: out/*

  verify:
    name: Verify downloaded artifact (${{ matrix.platform }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux / Ubuntu 18.04
            os: ubuntu-22.04
            staged_binary: jerryproxy
            archive: jerryproxy-linux-amd64.tar.gz
            artifact: jerryproxy-linux-amd64
            container_image: ubuntu@sha256:152dc042452c496007f07ca9127571cb9c29697f42acbfad72324b2bb2e43c98
            distribution_id: ubuntu
            version_id: "18.04"
          - platform: Linux / Ubuntu 20.04
            os: ubuntu-22.04
            staged_binary: jerryproxy
            archive: jerryproxy-linux-amd64.tar.gz
            artifact: jerryproxy-linux-amd64
            container_image: ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
            distribution_id: ubuntu
            version_id: "20.04"
          - platform: Linux / Debian 10
            os: ubuntu-22.04
            staged_binary: jerryproxy
            archive: jerryproxy-linux-amd64.tar.gz
            artifact: jerryproxy-linux-amd64
            container_image: debian@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc
            distribution_id: debian
            version_id: "10"
          - platform: Linux / Oracle Linux 7
            os: ubuntu-22.04
            staged_binary: jerryproxy
            archive: jerryproxy-linux-amd64.tar.gz
            artifact: jerryproxy-linux-amd64
            container_image: oraclelinux@sha256:1add6ed8602ea996528110fe75f4b03c2ca7ffdbe9497148dbb46c3cc9ce6acd
            distribution_id: ol
            version_id: "7.9"
          - platform: Linux / CentOS 7
            os: ubuntu-22.04
            staged_binary: jerryproxy
            archive: jerryproxy-linux-amd64.tar.gz
            artifact: jerryproxy-linux-amd64
            container_image: centos@sha256:be65f488b7764ad3638f236b7b515b3678369a5124c47b8d32916d6487418ea4
            distribution_id: centos
            version_id: "7"
          - platform: Linux / Amazon Linux 2
            os: ubuntu-22.04
            staged_binary: jerryproxy
            archive: jerryproxy-linux-amd64.tar.gz
            artifact: jerryproxy-linux-amd64
            container_image: amazonlinux@sha256:30508da01fdcf18d0bfac10a59d86f9e46954233746ee7360d26d77199e773d1
            distribution_id: amzn
            version_id: "2"
          - platform: Linux / openSUSE Leap 15.0
            os: ubuntu-22.04
            staged_binary: jerryproxy
            archive: jerryproxy-linux-amd64.tar.gz
            artifact: jerryproxy-linux-amd64
            container_image: opensuse/leap@sha256:064e0f679cebcd854adc1d5b814f6800805da3da9b36adb428d6cdc784b73ef8
            distribution_id: opensuse-leap
            version_id: "15.0"
          - platform: Windows
            os: windows-2022
            staged_binary: jerryproxy.exe
            archive: jerryproxy-windows-amd64.zip
            artifact: jerryproxy-windows-amd64
          - platform: macOS
            os: macos-15-intel
            staged_binary: jerryproxy
            archive: jerryproxy-macos-amd64.tar.gz
            artifact: jerryproxy-macos-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Show clean runner environment
        shell: bash
        run: |
          uname -a || true
          command -v python || true
          command -v python3 || true
          test ! -e jerryproxy_cli.py
          test ! -d jerryproxy
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: downloaded
      - name: Inspect and verify staged artifacts
        shell: bash
        run: |
          ls -lh downloaded
          cd downloaded
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check artifact-sha256.txt
          else
            shasum -a 256 --check artifact-sha256.txt
          fi
      - name: Extract Unix release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p extracted
          tar -xzf "downloaded/${{ matrix.archive }}" -C extracted
      - name: Extract Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Expand-Archive
          -Path "downloaded/${{ matrix.archive }}"
          -DestinationPath extracted
      - name: Make extracted binary executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x "extracted/${{ matrix.staged_binary }}"
      - name: Run Linux artifact in clean compatibility container
        if: runner.os == 'Linux'
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ matrix.container_image }}
          EXPECTED_ID: ${{ matrix.distribution_id }}
          EXPECTED_VERSION_ID: ${{ matrix.version_id }}
        run: |
          binary="$PWD/extracted/${{ matrix.staged_binary }}"
          docker run --rm \
            --env EXPECTED_VERSION_ID \
            --env EXPECTED_ID \
            --volume "$binary:/usr/local/bin/jerryproxy:ro" \
            "$CONTAINER_IMAGE" /bin/sh -eu -c '
              . /etc/os-release
              test "$ID" = "$EXPECTED_ID"
              test "$VERSION_ID" = "$EXPECTED_VERSION_ID"
              /usr/local/bin/jerryproxy --version
              output="$(/usr/local/bin/jerryproxy --home /tmp/self-check-home self-check --color)"
              printf "%s\n" "$output"
              printf "%s" "$output" | grep -F "$(printf "\033[1;32mOK\033[0m")" >/dev/null
              /usr/local/bin/jerryproxy --help >/dev/null
              /usr/local/bin/jerryproxy --home /tmp/self-check-home home
              /usr/local/bin/jerryproxy --home /tmp/self-check-home doctor
              /usr/local/bin/jerryproxy backend supported
              /usr/local/bin/jerryproxy --home /tmp/self-check-home backend list
              /usr/local/bin/jerryproxy --home /tmp/self-check-home backend current
              test -d /tmp/self-check-home/backends
              test -d /tmp/self-check-home/bin
              test -d /tmp/self-check-home/active
            '
      - name: Run packaged self-check
        if: runner.os != 'Linux'
        shell: bash
        run: >-
          "extracted/${{ matrix.staged_binary }}"
          --home self-check-home self-check --color
      - name: Exercise packaged CLI commands
        if: runner.os != 'Linux'
        shell: bash
        run: |
          binary="extracted/${{ matrix.staged_binary }}"
          "$binary" --version
          "$binary" --help >/dev/null
          "$binary" --home self-check-home home
          "$binary" --home self-check-home doctor
          "$binary" backend supported
          "$binary" --home self-check-home backend list
          "$binary" --home self-check-home backend current
          test -d self-check-home/backends
          test -d self-check-home/bin
          test -d self-check-home/active

  gate:
    name: Standalone two-stage gate
    if: always()
    needs: [build, verify]
    runs-on: ubuntu-22.04
    steps:
      - name: Verify build and clean-runner stages
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$VERIFY_RESULT" = success
