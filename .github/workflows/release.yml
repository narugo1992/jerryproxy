name: PyPI Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    # The test workflow publishes data-plane fixture images, and a called
    # workflow can only narrow the caller's token. Without this the push is
    # denied and the release gate can never pass.
    permissions:
      contents: read
      packages: write
    secrets: inherit

  standalone:
    uses: ./.github/workflows/standalone.yml

  build:
    needs: [tests, standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-build.txt -r requirements-doc.txt
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION=$(python -c 'from jerryproxy import __VERSION__; print(__VERSION__)')
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          git fetch --no-tags origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: make pdocs
      - run: make package
      - name: Rebuild publishable wheel from generated sdist
        run: |
          mkdir -p build/from-sdist
          tar -xzf dist/jerryproxy-*.tar.gz -C build/from-sdist
          rm dist/*.whl
          python -m build --wheel --outdir dist build/from-sdist/jerryproxy-*
          python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  package-smoke:
    name: Release ${{ matrix.kind }} smoke (Python ${{ matrix.python }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.7.17"
            kind: sdist
            pattern: "*.tar.gz"
          - os: ubuntu-latest
            python: "3.14"
            kind: sdist
            pattern: "*.tar.gz"
          - os: ubuntu-22.04
            python: "3.7.17"
            kind: wheel
            pattern: "*.whl"
          - os: ubuntu-latest
            python: "3.14"
            kind: wheel
            pattern: "*.whl"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Pin pip for Python 3.7
        if: startsWith(matrix.python, '3.7')
        run: python -m pip install "pip<24.1"
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist
      - run: python -m pip install dist/${{ matrix.pattern }}
      - run: python -m pip check
      - run: jerryproxy --version
      - run: jerryproxy --home package-smoke-home self-check --color
      - run: python -m jerryproxy backend list known
      - run: python -m jerryproxy backend list known mihomo --limit 2
      - name: Exercise exact artifact lookup from the release package
        shell: bash
        run: |
          version="$(python -m jerryproxy backend list known mihomo --limit 1 --json | python -c 'import json,sys; print(json.load(sys.stdin)[0]["version"])')"
          python -m jerryproxy backend list known mihomo "$version"

  publish:
    name: Publish through PyPI Trusted Publishing
    needs: package-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jerryproxy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          # Use the repository token when configured; the action still supports
          # Trusted Publishing through id-token: write when this is empty.
          password: ${{ secrets.PYPI_PASSWORD }}

  release:
    name: Publish the GitHub release
    # After PyPI: a release that advertises a version pip cannot install would
    # be worse than a late release. Both artifact sets come from this same run,
    # so the executables attached here are the ones the clean-runner stage
    # verified and the wheel is the one that was published.
    needs: [standalone, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: staging/python
      - uses: actions/download-artifact@v8
        with:
          name: jerryproxy-linux-amd64
          path: staging/linux
      - uses: actions/download-artifact@v8
        with:
          name: jerryproxy-windows-amd64
          path: staging/windows
      - uses: actions/download-artifact@v8
        with:
          name: jerryproxy-macos-amd64
          path: staging/macos
      - name: Collect the assets and merge their digests
        id: assets
        run: |
          set -euo pipefail
          mkdir -p assets
          # Exactly the files a user downloads: the two installable packages and
          # one archive per platform. The staged loose binaries stay behind.
          cp staging/python/*.whl staging/python/*.tar.gz assets/
          cp staging/linux/jerryproxy-linux-amd64.tar.gz assets/
          cp staging/windows/jerryproxy-windows-amd64.zip assets/
          cp staging/macos/jerryproxy-macos-amd64.tar.gz assets/
          # One manifest over exactly what is attached, recomputed here rather
          # than concatenated: a digest copied from an upstream file could
          # describe a different byte sequence than the one being uploaded.
          ( cd assets && sha256sum -- * > SHA256SUMS )
          cat assets/SHA256SUMS
          count=$(find assets -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 release assets, staged $count" >&2
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `--verify-tag` refuses to invent a tag, so a mistyped ref fails here
          # instead of creating a release that points at nothing.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            assets/*
