name: PyPI Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  standalone:
    uses: ./.github/workflows/standalone.yml

  build:
    needs: [tests, standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-build.txt -r requirements-doc.txt
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION=$(python -c 'from jerryproxy import __VERSION__; print(__VERSION__)')
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - run: make pdocs
      - run: make package
      - name: Rebuild publishable wheel from generated sdist
        run: |
          mkdir -p build/from-sdist
          tar -xzf dist/jerryproxy-*.tar.gz -C build/from-sdist
          rm dist/*.whl
          python -m build --wheel --outdir dist build/from-sdist/jerryproxy-*
          python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  package-smoke:
    name: Release ${{ matrix.kind }} smoke (Python ${{ matrix.python }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.7.17"
            kind: sdist
            pattern: "*.tar.gz"
          - os: ubuntu-latest
            python: "3.14"
            kind: sdist
            pattern: "*.tar.gz"
          - os: ubuntu-22.04
            python: "3.7.17"
            kind: wheel
            pattern: "*.whl"
          - os: ubuntu-latest
            python: "3.14"
            kind: wheel
            pattern: "*.whl"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Pin pip for Python 3.7
        if: startsWith(matrix.python, '3.7')
        run: python -m pip install "pip<24.1"
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist
      - run: python -m pip install dist/${{ matrix.pattern }}
      - run: python -m pip check
      - run: jerryproxy --version
      - run: jerryproxy --home package-smoke-home self-check --color
      - run: python -m jerryproxy backend supported

  publish:
    name: Publish through PyPI Trusted Publishing
    needs: package-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jerryproxy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
